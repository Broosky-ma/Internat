<title>تدبير القسم الداخلي</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f5f7;--card:#fff;--ink:#16324a;--mut:#5d7387;--line:#d9e2e9;--teal:#1b8a72;--amber:#e3a02f;--red:#c4452d;--blue:#2c6fa8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1c27;--card:#172a39;--ink:#e6eef5;--mut:#93a8ba;--line:#27425a}}
:root[data-theme="dark"]{--bg:#0f1c27;--card:#172a39;--ink:#e6eef5;--mut:#93a8ba;--line:#27425a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Tajawal,"Segoe UI",Tahoma,sans-serif;font-size:16px;line-height:1.6}
header{background:var(--ink);color:#fff;padding:14px 16px 0}
:root[data-theme="dark"] header{background:#0a141d}
h1{margin:0 0 10px;font-size:20px}
nav{display:flex;gap:4px}
nav button{flex:1;background:none;border:0;color:#b9cbdb;font:inherit;padding:10px 4px;border-bottom:3px solid transparent;cursor:pointer}
nav button.on{color:#fff;border-color:var(--amber);font-weight:700}
main{max-width:760px;margin:0 auto;padding:14px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px}
.big{font-size:32px;font-weight:700;line-height:1.1}
.mut{color:var(--mut);font-size:14px}
h2{font-size:17px;margin:18px 0 8px}
.row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.row:last-child{border:0}
.grow{flex:1;min-width:0}
input,select,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:6px;padding:8px;width:100%}
textarea{min-height:90px}
.f{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.btn{font:inherit;border:0;border-radius:6px;padding:9px 14px;background:var(--teal);color:#fff;cursor:pointer}
.btn.alt{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:5px 10px;font-size:14px}
.seg{display:flex;gap:4px}
.seg button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:6px;padding:5px 9px;cursor:pointer}
.seg .p.on{background:var(--teal);color:#fff;border-color:var(--teal)}
.seg .a.on{background:var(--red);color:#fff;border-color:var(--red)}
.seg .e.on{background:var(--amber);color:#16324a;border-color:var(--amber)}
.bars{display:flex;align-items:flex-end;gap:4px;height:110px;padding-top:16px}
.bars div{flex:1;text-align:center;font-size:11px;color:var(--mut)}
.bars i{display:block;background:var(--red);border-radius:3px 3px 0 0;min-height:2px;margin-bottom:2px}
.bar{height:10px;background:var(--line);border-radius:5px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--blue)}
.donut{width:84px;height:84px;border-radius:50%;margin:0 auto 6px;position:relative}
.donut:after{content:"";position:absolute;inset:20px;background:var(--card);border-radius:50%}
.tag{font-size:12px;padding:1px 7px;border-radius:10px;background:var(--line)}
.empty{text-align:center;color:var(--mut);padding:24px 8px}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--amber);outline-offset:1px}
.tb{width:100%;border-collapse:collapse;font-size:13px;color:#000}.tb th,.tb td{border:1px solid #444;padding:3px 4px;text-align:center}.tb td.l{text-align:right;white-space:nowrap}.tb th{background:#e8eef3}.sheet{background:#fff;color:#000;border:1px solid var(--line);border-radius:8px;padding:14px;margin-top:10px;overflow-x:auto}
@media print{header,.noprint{display:none!important}body{background:#fff}main{max-width:none;padding:0}.sheet{border:0;padding:0;margin:0;overflow:visible}}
</style>
<style>nav button{font-size:14px}.chips{display:flex;flex-wrap:wrap;gap:6px}.chips button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:16px;padding:5px 12px;cursor:pointer}.chips .on{background:var(--ink);color:var(--bg);border-color:var(--ink)}details summary{cursor:pointer;padding:6px 0}.f label{display:block}.sheet h3{font-size:15px;margin:12px 0 4px}.sheet p{margin:8px 0;line-height:1.9}.slips{display:grid;grid-template-columns:1fr 1fr;gap:5px;page-break-after:always}.slips:last-child{page-break-after:auto}.slip{border:1px dashed #666;padding:5px;font-size:11px;break-inside:avoid}.slip .tb{font-size:11px}.slip .tb th,.slip .tb td{padding:1px 3px}#sp{display:none}.spage{text-align:center;page-break-after:always;height:190mm;overflow:hidden}.spage:last-child{page-break-after:auto}.spage .lh{display:block;width:92mm;margin:0 auto 3mm}.spage .st{font-size:22pt;font-weight:700;color:var(--ink)}.spage .ss{font-size:11pt;color:var(--mut);margin-bottom:5mm}.spage .lg{justify-content:center;font-size:12pt}
@media print{:root,:root:not([data-theme="light"]),:root[data-theme="dark"]{--bg:#fff!important;--card:#fff!important;--ink:#12344d!important;--mut:#5d6d7a!important;--line:#d8d8d8!important}body.ps main,body.ps header,body.ps #bn{display:none!important}body.ps #sp{display:block}}
.lpage{page-break-after:always;margin-bottom:28px}.lpage:last-child{page-break-after:auto}</style>
<style>
:root{--bg:#f3f1ec;--card:#fff;--ink:#12344d;--mut:#6b7c8a;--line:#e6e2d9;--teal:#1b7f6b;--amber:#d99a2b;--red:#c4452d;--blue:#2c6fa8;--sh:0 1px 2px rgba(18,52,77,.06),0 8px 22px rgba(18,52,77,.07)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1a24;--card:#152636;--ink:#e8eff5;--mut:#92a6b7;--line:#23394d;--sh:none}}

body{background:var(--bg)}
header{background:linear-gradient(135deg,#0f2c43,#1d5273);padding:16px 16px 0;position:sticky;top:0;z-index:5;box-shadow:0 2px 10px rgba(0,0,0,.15)}
h1{font-size:22px;font-weight:700;margin:0 0 2px}
.hs{color:#b9cbdb;font-size:13px;margin:0 0 10px}
nav{gap:2px}nav button{border-radius:12px 12px 0 0;padding:11px 4px;font-weight:500;border-bottom:0!important}
nav button.on{background:var(--bg);color:var(--ink);font-weight:700}
main{max-width:1000px;padding:16px 14px 40px}
.card{border:0;border-radius:16px;box-shadow:var(--sh);padding:16px}
.btn{border-radius:10px;padding:10px 16px;font-weight:500;transition:filter .15s}.btn:hover{filter:brightness(1.08)}.btn.alt{border:1px solid var(--line)}
input,select,textarea{border-radius:10px;padding:10px}input:focus,select:focus,textarea:focus{outline:2px solid var(--amber);outline-offset:0}
h2{font-size:16px;margin:24px 4px 10px;display:flex;align-items:center;gap:8px}
h2:before{content:"";width:4px;height:16px;border-radius:2px;background:var(--amber)}
.sheet h2,.sheet h3{display:block}.sheet h2:before{display:none}
.row{padding:10px 0}
.bar{height:12px;border-radius:6px}
.av{width:36px;height:36px;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;flex:none}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.kpi{position:relative;overflow:hidden;padding-top:18px}.kpi:before{content:"";position:absolute;inset:0 0 auto 0;height:4px;background:var(--c,var(--blue))}
.kpi .v{font-size:32px;font-weight:700;line-height:1.1}.kpi .l{color:var(--mut);font-size:13px;margin-top:4px}
.cg{display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
.lg{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--mut);margin-top:8px}.lg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:5px}
.ct{font-weight:700;margin-bottom:8px}
@media (min-width:700px){.kpis{grid-template-columns:repeat(4,1fr)}.cg{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
header{padding-left:max(16px,calc((100vw - 1000px)/2 + 14px));padding-right:max(16px,calc((100vw - 1000px)/2 + 14px))}
@media print{header{position:static;box-shadow:none}#bn{display:none!important}}
</style>
<style>
body{padding-right:264px}
header{display:flex!important;align-items:center;gap:12px;padding:12px 20px!important}
header h1{margin:0;font-size:19px}.hs{margin:0}
.mb{display:none;background:rgba(255,255,255,.14);border:0;color:#fff;width:40px;height:40px;border-radius:10px;font-size:20px;cursor:pointer;flex:none}
#side{position:fixed;top:0;right:0;bottom:0;width:264px;background:#0f2c43;color:#cfdce8;overflow-y:auto;z-index:30;padding:14px 10px 24px}
.sbh{padding:6px 10px 16px;font-weight:700;color:#fff;font-size:17px;border-bottom:1px solid rgba(255,255,255,.12);margin-bottom:10px}
.mi,.sub{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;color:inherit;font:inherit;text-align:right;padding:11px 12px;border-radius:10px;cursor:pointer;margin-bottom:2px}
.mi:hover,.sub:hover{background:rgba(255,255,255,.08)}
.mi.on{background:rgba(255,255,255,.12);color:#fff;font-weight:700}
.mi svg{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.mi .ar{margin-inline-start:auto;font-style:normal;opacity:.7}
.sub{padding:8px 12px;margin-right:30px;width:calc(100% - 30px);font-size:14px}
.sub.on{background:var(--amber);color:#12344d;font-weight:700}
#ov{display:none}
@media (max-width:900px){body{padding-right:0}.mb{display:inline-flex;align-items:center;justify-content:center}#side{transform:translateX(105%);transition:transform .22s}body.sb #side{transform:none;box-shadow:-8px 0 30px rgba(0,0,0,.35)}body.sb #ov{display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:25}}

</style>

 else if(b.dataset.ar){var rr=(S.arch||[]).filter(function(x){return x.id===b.dataset.ar})[0];if(rr&&confirm("سيحل أرشيف الموسم "+rr.year+" محل البيانات الحالية. يُنصح بحفظ السنة الحالية في الأرشيف أولًا. المتابعة؟")){var d=JSON.parse(JSON.stringify(rr.data));S.students=d.students;S.inc=d.inc||[];S.cfg=d.cfg||S.cfg;mut("POST","/api/restore",{students:S.students,inc:S.inc,cfg:S.cfg});tab="dash";render()}}
 else if(b.dataset.ad){if(confirm("حذف هذه السنة من الأرشيف نهائيًا؟")){S.arch=(S.arch||[]).filter(function(x){return x.id!==b.dataset.ad});mut("DELETE","/api/archive/"+b.dataset.ad);render()}}
 else if(id==="pr"){document.getElementById("pg").textContent="@page{size:portrait;margin:"+(dty==="card"?"7mm":"12mm")+"}";try{window.print()}catch(x){alert("تعذرت الطباعة من هذه الصفحة.")}}
 else if(b.dataset.ed){ed=b.dataset.ed;render();window.scrollTo(0,0)}
 else if(b.dataset.lv){var s1=S.students.filter(function(x){return x.id===b.dataset.lv})[0];if(s1&&confirm("تسجيل مغادرة "+s1.n+"؟")){s1.left=true;mut("POST","/api/student",s1);render()}}
 else if(b.dataset.del){if(confirm("حذف هذا النزيل نهائيًا؟")){mut("DELETE","/api/student/"+b.dataset.del);S.students=S.students.filter(function(x){return x.id!==b.dataset.del});render()}}
};
document.getElementById("app").onchange=function(e){var i=e.target.id,v=e.target.value;if(i==="dt"&&v)day=v;else if(i==="dtype")dty=v;else if(i==="dstu")ds=v;else if(i==="dgk")dgk=v;else if(i==="dfrom")dfrom=v;else if(i==="dcl")dcl=v;else if(i==="f_c"){var l0=lvOf(v);if(l0)document.getElementById("f_lv").value=l0;return}else if(i==="dpg")dpg=v;else if(i==="dcn")dcn=v;else if(i==="dmode")dmode=v;else if(i==="of"){var fl=e.target.files[0];if(fl){var rr=new FileReader();rr.onload=function(){try{var d=JSON.parse(rr.result);if(d.students){S=d;save();render()}}catch(x){alert("الملف غير صالح")}};rr.readAsText(fl)}return}else return;render()};
document.getElementById("app").oninput=function(e){var i=e.target.id;if(i==="dref"||i==="dtxt"||i==="dr"){if(i==="dref")dref=e.target.value;else if(i==="dtxt")dtxt=e.target.value;else dr=e.target.value;document.getElementById("sh").innerHTML=sheetS();return}if(e.target.id==="q"){q=e.target.value.trim();var p=e.target.selectionStart;render();var i=document.getElementById("q");i.focus();i.setSelectionRange(p,p)}};
render();fstat();initFH();document.getElementById("bn").onclick=function(e){if(e.target.id==="fcon"){if(FS==="ask")reconnect();else{tab="cfg";render();window.scrollTo(0,0)}}};
